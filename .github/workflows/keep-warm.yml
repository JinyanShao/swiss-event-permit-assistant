name: Keep the demo warm

# GitHub can delay or drop scheduled events, so this is an opportunistic health
# check, not a reliable way to keep the Azure Free-tier app warm. Cold starts
# after idle time remain an expected experience on F1.
#
# A failed ping fails this job. GitHub notifications follow the schedule
# actor's personal Actions notification preferences.

on:
  schedule:
    # every 10 minutes, offset off the hour — GitHub delays jobs scheduled on
    # round times when the shared runners are busy
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6 # Three 90-second requests plus retry waits need up to 330 seconds.
    steps:
      - name: Ping the live demo
        run: |
          URL="https://sepa-jinyan.azurewebsites.net/"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::$URL did not return 200 after 3 attempts (last: $code)"
          exit 1
